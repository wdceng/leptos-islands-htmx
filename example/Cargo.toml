[package]
name = "leptos-islands-htmx-example"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
console_error_panic_hook = "0.1.7"
leptos = { version = "0.8.22", features = ["islands"] }
leptos-islands-htmx = { path = ".." }
leptos_meta = "0.8.7"
leptos_axum = { version = "0.8.10", optional = true }
any_spawner = { version = "0.3.0", features = ["tokio"], optional = true }
axum = { version = "0.8.1", optional = true }
tokio = { version = "1.39", features = ["full"], optional = true }
wasm-bindgen = "0.2.100"

[features]
hydrate = ["leptos/hydrate", "leptos-islands-htmx/hydrate"]
ssr = [
  "dep:axum",
  "dep:tokio",
  "dep:leptos_axum",
  "dep:any_spawner",
  "leptos/ssr",
  "leptos_meta/ssr",
  "leptos-islands-htmx/ssr",
]

[package.metadata.leptos]
output-name = "leptos_islands_htmx_example"
site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "style.css"
assets-dir = "public"
site-addr = "127.0.0.1:3000"
reload-port = 3001
end2end-cmd = "npx playwright test"
end2end-dir = "e2e"
browserquery = "defaults"
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
lib-profile-release = "wasm-release"
